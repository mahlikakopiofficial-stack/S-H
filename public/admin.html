<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>S-H Admin</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="section adminPage">
    <div class="sectionhead">
      <div>
        <p class="eyebrow">PRIVATE ADMIN</p>
        <h1>S-H Inventory</h1>
        <p>Inventory remains visible to admin with Available, Reserved and Sold states.</p>
      </div>
    </div>

    <div class="adminLogin">
      <label for="pw">Admin password</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="Enter admin password">
      <button class="button" type="button" onclick="loadAdmin()">Load inventory</button>
    </div>

    <div id="adminStatus" class="inventoryNotice" role="status"></div>
    <div id="admin"></div>
  </main>

  <script src="/admin.js"></script>
</body>
</html>
