<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S-H Admin</title><style>body{margin:0;font-family:system-ui;background:#f3f0e9;color:#171717}.wrap{max-width:1400px;margin:auto;padding:30px 5vw}.panel,.login,.editor{background:#fff;border:1px solid #ddd6ca;border-radius:18px;padding:22px;margin:18px 0}.login{max-width:420px;margin:10vh auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:18px;background:#f5f1e9;border-radius:12px}.stat b{display:block;font-size:28px}.tools{display:flex;gap:10px;margin-bottom:12px}input,select,button{padding:10px;border-radius:9px;border:1px solid #ccc}button{background:#111;color:#fff;cursor:pointer}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid #eee}.editor{position:fixed;inset:5%;overflow:auto;z-index:5}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid input{width:100%}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}table{display:block;overflow:auto}}</style></head><body><div class="wrap"><section id="login" class="login"><h1>S—H Admin</h1><p>Inventory, reservations and orders.</p><input id="password" type="password" placeholder="Admin password" style="width:100%"><p><button id="loginBtn">Open dashboard</button></p><p id="message"></p></section><main id="panel" hidden><header style="display:flex;justify-content:space-between;align-items:center"><h1>Operations dashboard</h1><button id="refresh">Refresh</button></header><p id="message"></p><div id="summary" class="grid"></div><section class="panel"><h2>Inventory</h2><div class="tools"><input id="invSearch" placeholder="Search SKU, item, title or category" style="flex:1"></div><table><thead><tr><th>SKU</th><th>Item</th><th>Category</th><th>Qty</th><th>Available</th><th>Status</th><th></th></tr></thead><tbody id="inventory"></tbody></table></section><section class="panel"><h2>Orders</h2><table><thead><tr><th>Order</th><th>Customer</th><th>Phone</th><th>Total</th><th>Status</th><th>Date</th></tr></thead><tbody id="orders"></tbody></table></section></main><section id="editor" class="editor" hidden><button onclick="closeEditor()">Close</button><h2>Edit item</h2><form id="editForm"><input id="editId" type="hidden"><div class="formgrid"><input id="editTitle" placeholder="Title" required><input id="editBrand" placeholder="Brand"><input id="editPrice" type="number" step="0.001" placeholder="Price"><input id="editQty" type="number" min="0" placeholder="Quantity"><input id="editImage" placeholder="Primary image URL"><input id="editImages" placeholder="Gallery image URLs, comma separated"></div><p><label><input id="editActive" type="checkbox"> Active listing</label></p><button>Save item</button></form></section></div><script src="/admin.js"></script></body></html>
